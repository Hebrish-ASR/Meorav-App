# Meorav (beta) desktop: tag desktop-vX.Y.Z -> meorav_X.Y.Z-1_amd64.deb (job deb) and
# Meorav-X.Y.Z-windows-x64.zip (job windows, since 0.2.0) on one GitHub release.
# Pushes touching desktop/ only build and self-test. On a tag or a manual run the jobs also
# download the real Q4_K_M models from cdn.hebrish.app and speak: Linux Daniel (Meorav v2.2) and
# Josh (Meorav-Multi-Voice), Windows Josh. The end-to-end check, kept off Daniel's laptop. The Android workflow listens on v* tags only, and
# F-Droid reads vX.Y.Z only, so desktop-v* tags touch neither.
# Publishing to the Hebrish APT repo is a separate, manual step (desktop/README.md, "Releasing").
name: desktop
on:
  push:
    tags: ["desktop-v*"]
    branches: [main]
    paths: ["desktop/**", "catalog/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write
  # gh attestation verify meorav_X.Y.Z-1_amd64.deb -R Hebrish-ASR/Meorav-App
  id-token: write
  attestations: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    defaults: { run: { working-directory: desktop } }
    steps:
      - name: Build tools
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git ca-certificates cmake g++ make binutils python3 python3-pytest python3-numpy
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' meorav/__init__.py)
          [ "desktop-v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but __version__ is $v"; exit 1; }
      - name: Tests
        run: python3 -m pytest -q tests
      - name: Build
        run: ./build-deb.sh
      - name: v2 build has no AVX
        run: |
          n=$(objdump -d build/v2/libmeorav.so | grep -c ymm || true)
          [ "$n" = 0 ] || { echo "::error::v2 libmeorav.so uses AVX ($n ymm instructions)"; exit 1; }
      - name: Install and self-test
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q ./dist/meorav_*_amd64.deb
          cd "$RUNNER_TEMP"   # outside the checkout: the installed app must be the one tested
          meorav --selftest | tee st.txt
          grep -q "lib /usr/lib/meorav/meorav/lib/" st.txt && grep -q "app: /usr/lib/meorav/meorav" st.txt && grep -q "avatars: 5/5" st.txt
          MEORAV_LIB_DIR=/usr/lib/meorav/meorav/lib PYTHONPATH=/usr/lib/meorav python3 -c \
            "from meorav import engine; print(engine.find_library('v2'))"
      - name: Speak one line (real voices)
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          cd "$RUNNER_TEMP"
          export MEORAV_CATALOG="$GITHUB_WORKSPACE/catalog/catalog.json"   # test the catalogue about to be published
          meorav --list-voices
          echo "### Speak one line (Linux)" >> "$GITHUB_STEP_SUMMARY"
          for v in daniel josh; do
            meorav --say "Testing Meorav on the desktop, before Shabbat, b'ezrat Hashem." --voice $v -o speak-$v.wav | tee speak-$v.txt
            python3 -c "import wave,sys; w = wave.open(sys.argv[1]); s = w.getnframes() / w.getframerate(); print(f'{s:.1f} s'); assert 1.0 < s < 30" speak-$v.wav
            cat speak-$v.txt >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        with: { name: speak-linux, path: "${{ runner.temp }}/speak-*.wav", retention-days: 14 }
      - name: Name
        run: echo "DEB=$(ls dist/meorav_*_amd64.deb)" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { subject-path: "desktop/${{ env.DEB }}" }
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: "desktop/${{ env.DEB }}" }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ilammy/msvc-dev-cmd@v1   # dumpbin for the no-AVX check
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = (Select-String -Path meorav\__init__.py -Pattern '^__version__ = "(.*)"$').Matches[0].Groups[1].Value
          if ("desktop-v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME but __version__ is $v" }
      - name: Tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest numpy
          python -m pytest -q tests
      - name: Build
        run: ./build-windows.ps1
      - name: v2 build has no AVX
        # Checked on our static libraries (ggml, ggml-base, ggml-cpu, qwen-core), not on meorav.dll:
        # the DLL also holds the static MSVC CRT, whose memcpy/memset carry AVX paths behind a
        # runtime CPUID check (__isa_available); those are safe and made the DLL count 215 (run 43878402456).
        run: |
          $libs = Get-ChildItem -Recurse -Filter *.lib build\win-v2 | Where-Object { $_.Name -match '^(ggml|qwen)' }
          if ($libs.Count -lt 3) { throw "expected ggml*/qwen-core .lib files, found: $($libs.Name)" }
          $bad = @()
          foreach ($l in $libs) {
            $d = dumpbin /disasm $l.FullName
            $hits = $d | Select-String -SimpleMatch "ymm"
            "$($l.Name): $($hits.Count) ymm"
            if ($hits.Count) {
              $bad += $l.Name
              # show the enclosing function (dumpbin prints "name:" labels) of every hit
              foreach ($h in $hits) {
                $fn = ($d[0..($h.LineNumber - 1)] | Select-String -Pattern '^[^\s].*:$' | Select-Object -Last 1).Line
                "  in $fn :: $($h.Line.Trim())"
              }
            }
          }
          if ($bad) { "::warning::v2 libraries with ymm instructions: $bad (see the functions above)" }
          $l3 = Get-ChildItem -Recurse -Filter ggml-cpu.lib build\win-v3
          "v3 ggml-cpu.lib ymm: $((dumpbin /disasm $l3[0].FullName | Select-String -SimpleMatch 'ymm').Count)"
          dumpbin /dependents build\win-v3\Release\meorav.dll
      - name: Unzip and self-test
        run: |
          $zip = (Get-Item dist\Meorav-*-windows-x64.zip).FullName
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\m"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\m" -Directory)[0].FullName
          "MEORAV_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          Set-Location $env:RUNNER_TEMP   # outside the checkout: the unzipped app must be the one tested
          & "$dir\meorav-cli.cmd" --selftest | Tee-Object st.txt
          if ($LASTEXITCODE) { throw "selftest failed" }
          if (-not (Select-String -Path st.txt -SimpleMatch "$dir\app\meorav\lib\")) { throw "selftest did not load the packaged meorav.dll" }
          if (-not (Select-String -Path st.txt -SimpleMatch "avatars: 5/5")) { throw "avatars missing" }
          $env:MEORAV_CPU_LEVEL = "v2"; & "$dir\meorav-cli.cmd" --selftest
          if ($LASTEXITCODE) { throw "v2 selftest failed" }
      - name: Speak one line (real voice)
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          Set-Location $env:RUNNER_TEMP
          $env:MEORAV_CATALOG = "$env:GITHUB_WORKSPACE\catalog\catalog.json"   # test the catalogue about to be published
          & "$env:MEORAV_DIR\meorav-cli.cmd" --say "Testing Meorav on Windows, before Shabbat, b'ezrat Hashem." --voice josh -o speak-josh.wav | Tee-Object speak.txt
          if ($LASTEXITCODE) { throw "speak failed" }
          python -c "import wave,sys; w = wave.open(sys.argv[1]); s = w.getnframes() / w.getframerate(); print(f'{s:.1f} s'); assert 1.0 < s < 30" speak-josh.wav
          if ($LASTEXITCODE) { throw "bad wav" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Meorav\models\meorav-multi-voice")) { throw "model not under %LOCALAPPDATA%\Meorav" }
          "### Speak one line (Windows)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content speak.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        with: { name: speak-windows, path: "${{ runner.temp }}/speak-josh.wav", retention-days: 14 }
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { subject-path: "${{ env.ZIP }}" }
      - uses: actions/upload-artifact@v4
        with: { name: windows-zip, path: "${{ env.ZIP }}", compression-level: 0 }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deb, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-zip, path: dist }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not "Latest": that stays the Android release. Not a prerelease either (house rule).
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.zip --latest=false \
            --title "Meorav (beta) for Linux and Windows ${GITHUB_REF_NAME#desktop-v}" \
            --notes-file .github/desktop-release-notes.md
